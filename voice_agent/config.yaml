# Settings for the voice agent.
#
# Environment variables override these values (handy because the server's port changes with every job):
#   LLM_BASE_URL  overrides llm.base_url
#   LLM_MODEL     overrides llm.model
#   LLM_API_KEY   overrides llm.api_key

llm:
  model: openai/gpt-oss-20b
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY            # only checked if the vLLM server was started with --api-key
  max_tokens: 512           # gpt-oss's thinking tokens count against this too
  reasoning_effort: low     # low | medium | high; higher means a longer wait before the first word
  max_tool_rounds: 4        # requests per user turn: one, plus one after each round of tool calls
  # Sent as the first ("system") message of every request. The "|" keeps the line breaks.
  system_prompt: |
    You are a voice assistant. The user hears your reply through a speaker and cannot see text.
    - Answer in one or two short sentences.
    - Use plain spoken words only: no markdown, lists, tables, emoji or symbols.
    - Never invent facts. If you don't know, say so.
    - Repeat back the values you act on, such as a duration, a time or a room.
    - If a request is missing something you need, ask one short question for it.
    - Use the timer tools for anything about timers. Never say a timer was set, changed or cancelled
      unless the tool call succeeded. Get the time left from list_timers and say it roughly, in words.
